name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Web App
        run: bun run --cwd apps/web build

      # The Vercel function (api/[[...route]].ts) imports the bundle this step
      # produces (apps/server/dist/app.cjs). Without it here, a server-side
      # break only surfaces as a runtime 500 after deploying.
      - name: Build API bundle
        run: bun run --cwd apps/server build

      - name: Verify API bundle exists
        run: test -s apps/server/dist/app.cjs
