name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build Web App
        run: bun run --cwd client build

      # The Vercel functions in api/ are plain Node.js handlers with no build
      # step. The Hono app under apps/server stays for local development only.
      - name: Build API bundle (local dev server)
        run: bun run --cwd apps/server build
