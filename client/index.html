<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicons: one default + apple-touch + manifest (extra sizes are
         redundant — the browser scales the 32px down). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/appicon256.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Meta -->
    <!-- viewport-fit=cover lets fixed elements use safe-area insets (notch /
         home indicator) on phones; theme-color now matches the header (light)
         and the dark palette, instead of the old clashing navy. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Gadget Wallet - Premium electronics store. Experience the future of technology." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load async (media=print swap) so they never block first paint.
         `display=swap` is already in the URL for text fallback. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- LCP hero image: start fetching it before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="https://images.unsplash.com/photo-1468495244123-6c6c332eeece?w=1320&q=80"
    />
    <title>Gadget Wallet - Premium Electronics</title>
    <script>
      // Apply the saved (or system) theme BEFORE first paint so there is no
      // light-mode flash on devices set to dark. Profile.tsx keeps the toggle
      // in sync (localStorage key "gw-dark", "1" = dark).
      (function () {
        try {
          var stored = localStorage.getItem("gw-dark");
          var dark =
            stored === "1" ||
            (stored === null && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage unavailable — default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
